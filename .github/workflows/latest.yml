name: Refresh Latest feed

# Runs on GitHub's servers, so it keeps working while the laptop is shut.
on:
  schedule:
    # Every 30 min during festival week (30 Jul – 3 Aug 2026), 08:00–03:00 Irish time.
    # GitHub cron is UTC and best-effort — expect a few minutes' drift.
    - cron: "*/30 7-23 30-31 7 *"
    - cron: "*/30 0,1,2 30-31 7 *"
    - cron: "*/30 7-23 1-3 8 *"
    - cron: "*/30 0,1,2 1-3 8 *"
    # Hourly in the run-up so the feed isn't cold on arrival.
    - cron: "17 * 25-29 7 *"
  workflow_dispatch: {}       # lets you trigger it by hand from the Actions tab

concurrency:
  group: latest-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        run: pip install --quiet anthropic

      - name: Collect
        run: python3 scripts/collect.py

      - name: Triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/parse.py

      - name: Commit if changed
        run: |
          git config user.name  "atn-latest-bot"
          git config user.email "actions@github.com"
          git add latest.json page_hashes.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Latest feed: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
