<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATN 2026 — The Guide</title>
<meta name="theme-color" content="#0d0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATN 26">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#0c0b0f; --card:#17161c; --card2:#1f1e26; --line:#2b2a34;
  --tx:#f4f3f7; --dim:#9d9aab; --dim2:#6f6c7e;
  --acc:#ff2f74;
  --rock:#ff4d4d; --indie:#ffb02e; --dj:#8b6dff; --global:#25d366; --trad:#38bdf8; --other:#94a3b8;
  --safeb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + var(--safeb));
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--acc)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(12,11,15,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.brand h1{font-size:17px;letter-spacing:-.03em}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#7c3aed);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.brand .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:16px}

/* ---------- committee score ---------- */
.score{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.slab{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.snum{font-size:15px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.sb{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.sbl{font-size:10.5px;color:var(--dim2);width:56px;flex:none}
.sbt{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.sbt i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#7c3aed)}
.sbv{font-size:10.5px;color:var(--dim);width:22px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.sconf{font-size:10.5px;color:var(--dim2);margin-top:6px;line-height:1.45}
.smath{font-size:10.5px;color:var(--dim2);margin-top:7px;font-variant-numeric:tabular-nums}
.smath .bonus{color:var(--acc);font-weight:700}
.legend{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.5;
  background:rgba(255,47,116,.09);border:1px solid rgba(255,47,116,.25);
  border-radius:9px;padding:8px 9px}
.legend b{color:var(--tx);font-weight:650;white-space:nowrap}

/* ---------- hour by hour ---------- */
.hr{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.hr .hrt{flex:none;width:82px;font-size:11.5px;font-weight:700;color:var(--acc);
  font-variant-numeric:tabular-nums;padding-top:1px}
.hr .hrb{flex:1;min-width:0;font-size:13.5px;line-height:1.45}
.hr .hrb b{font-weight:650}
.hr .hrs{display:inline-block;font-size:10.5px;font-weight:800;color:var(--acc);
  background:rgba(255,47,116,.14);border-radius:5px;padding:1px 5px;margin-left:4px;
  vertical-align:1px;font-variant-numeric:tabular-nums}
.hr .hrw{display:block;font-size:11.5px;color:var(--dim2);margin-top:2px}
.hr .hrn{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:#ffb02e;background:rgba(255,176,46,.15);
  border-radius:4px;padding:2px 5px;margin-top:4px}
.hr .hru{display:block;font-size:11.5px;color:var(--dim2);margin-top:3px;font-style:italic}

/* ---------- listen links ---------- */
.listen{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.listen a{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:5px 10px;
  border-radius:9px;background:var(--card2);border:1px solid var(--line);
  font-size:11.5px;font-weight:650;color:var(--tx);text-decoration:none}
.listen a .pd{width:7px;height:7px;border-radius:50%;flex:none}
.listen a.yt .pd{background:#ff0033}
.listen a.sp .pd{background:#1db954}
.listen a.am .pd{background:#fa2d48}
.listen .sng{font-size:11.5px;color:var(--dim2);align-self:center;font-style:italic}

.days{display:flex;gap:6px;padding:2px 12px 10px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;padding:8px 14px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap}
.day .dnum{display:block;font-size:10px;font-weight:500;color:var(--dim2);letter-spacing:.04em}
.day.on{background:var(--tx);color:#000;border-color:var(--tx)}
.day.on .dnum{color:#555}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:6px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.on{color:#000;border-color:transparent}
.chip.on[data-g=all]{background:var(--tx)}
.chip.on[data-g=rock]{background:var(--rock)}
.chip.on[data-g=indie]{background:var(--indie)}
.chip.on[data-g=dj]{background:var(--dj);color:#fff}
.chip.on[data-g=global]{background:var(--global)}
.chip.on[data-g=trad]{background:var(--trad)}
.chip.on[data-g=other]{background:var(--other)}

/* ---------- now bar ---------- */
#nowbar{margin:10px 12px 0;padding:11px 13px;border-radius:14px;background:linear-gradient(135deg,rgba(255,47,116,.16),rgba(124,58,237,.16));border:1px solid rgba(255,47,116,.35)}
#nowbar .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700;display:flex;align-items:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:p 1.8s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
#nowbar .row{font-size:13.5px;margin-top:5px;line-height:1.45}
#nowbar .row b{font-weight:650}
#nowbar .row span{color:var(--dim)}

/* ---------- layout ---------- */
main{padding:14px 12px 24px}
.brand,.days,.filters{max-width:660px;margin-left:auto;margin-right:auto}
main{max-width:660px;margin-left:auto;margin-right:auto}
#nowbar{max-width:636px;margin-left:auto;margin-right:auto}
nav{justify-content:center}
nav button{max-width:165px}
.sechead{display:flex;align-items:baseline;gap:8px;margin:22px 2px 10px}
.sechead:first-child{margin-top:6px}
.sechead h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2)}
.sechead .ln{flex:1;height:1px;background:var(--line)}

/* ---------- set card ---------- */
.set{display:flex;gap:11px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;position:relative;overflow:hidden}
.set::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--other)}
.set[data-g=rock]::before{background:var(--rock)}
.set[data-g=indie]::before{background:var(--indie)}
.set[data-g=dj]::before{background:var(--dj)}
.set[data-g=global]::before{background:var(--global)}
.set[data-g=trad]::before{background:var(--trad)}
.set[data-g=""]::before{background:var(--line)}
.set.t1{background:var(--card2)}
.set .body{flex:1;min-width:0}
.set .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px}
.set .time{font-size:12px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.set .badge{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2.5px 6px;border-radius:5px}
.b1{background:var(--acc);color:#fff}
.b2{background:rgba(255,255,255,.12);color:var(--tx)}
.b3{background:transparent;color:var(--dim2);border:1px solid var(--line)}
.set h3{font-size:15.5px;line-height:1.3;margin:1px 0 3px;word-wrap:break-word}
.set .stage{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px}
.set .note{font-size:13px;color:var(--dim);margin-top:7px;line-height:1.5;border-top:1px solid var(--line);padding-top:7px}
.star{flex:none;width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:17px;align-self:flex-start;transition:transform .12s}
.star:active{transform:scale(.88)}
.star.on{background:rgba(255,47,116,.2)}

/* ---------- pinned set ---------- */
.pin{position:relative;border-radius:16px;padding:15px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,47,116,.22),rgba(124,58,237,.22));
  border:1px solid rgba(255,47,116,.5)}
.pin .ptag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);
  font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pin h2{font-size:21px;line-height:1.15;margin-bottom:5px}
.pin .pwhen{font-size:13.5px;font-weight:650;color:var(--tx)}
.pin .pwhen span{color:var(--dim);font-weight:400}
.pin .pcd{display:inline-block;margin-top:9px;padding:5px 10px;border-radius:20px;
  background:rgba(0,0,0,.35);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.pin .pcd.live{background:var(--acc);color:#fff}
.pin .pnote{font-size:13px;color:var(--dim);margin-top:10px;line-height:1.5;
  border-top:1px solid rgba(255,255,255,.14);padding-top:9px}
.pin .pnote b{color:var(--tx);font-weight:650}

/* ---------- top 3 ---------- */
.t3{border-radius:16px;padding:15px;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(255,47,116,.16),rgba(124,58,237,.16));
  border:1px solid rgba(255,47,116,.4)}
.t3row{display:flex;gap:11px;padding:11px 0;border-top:1px solid rgba(255,255,255,.13)}
.t3row:first-of-type{border-top:none;padding-top:4px}
.t3n{flex:none;width:23px;height:23px;border-radius:50%;background:var(--acc);color:#fff;
  font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.t3b{flex:1;min-width:0}
.t3b b{font-size:16px;font-weight:700;display:block;line-height:1.25}
.t3w{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.t3r{display:block;font-size:12.5px;color:var(--tx);opacity:.88;margin-top:6px;line-height:1.5}
.t3l{display:inline-block;font-size:11.5px;font-weight:650;margin-top:6px;text-decoration:none}

/* ---------- live review ---------- */
.live{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.5;
  border-top:1px solid var(--line);padding-top:7px}
.llab{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2);font-weight:700;margin-bottom:3px}
.live a{font-weight:650;white-space:nowrap}

/* ---------- map ---------- */
.stagelink{color:inherit;text-decoration:none;border-bottom:1px dotted var(--dim2);
  display:inline-block;padding:8px 1px;line-height:1.3}
.zonecard{border-radius:14px;background:var(--card);border:1px solid var(--line);
  padding:14px;margin-bottom:10px}
.zonecard h3{font-size:15px;margin-bottom:3px}
.zonecard .zt{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:9px}
.zonecard .zs{display:flex;flex-wrap:wrap;gap:5px}
.zonecard .zs span{font-size:11.5px;background:var(--card2);border:1px solid var(--line);
  padding:3px 8px;border-radius:14px;color:var(--tx)}
.zonecard.hit{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.walk{display:flex;align-items:baseline;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.walk:first-of-type{border-top:none}
.walk .wm{flex:none;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;width:52px}
.walk .wl{flex:1;color:var(--dim);line-height:1.45}
.walk .wl b{color:var(--tx);font-weight:600}
.mapdiag{width:100%;height:auto;display:block;margin:2px 0 4px;overflow:visible}
.mapdiag text{font-family:inherit}

/* ---------- plan / narrative ---------- */
.plan{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:15px;margin-bottom:14px}
.plan h2{font-size:17px;margin-bottom:3px}
.plan .tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:7px}
.plan p{font-size:13.5px;color:var(--dim);margin:0 0 12px;line-height:1.55}
.walknote{font-size:12.5px;color:var(--dim);line-height:1.55;background:var(--card2);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:0 0 13px}
.walknote b{color:var(--tx);font-weight:650}
.walknote em{font-style:italic}
.leg{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.leg .lt{font-size:11.5px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;flex:none;width:52px;padding-top:1px}
.leg .lb{flex:1;font-size:13.5px;line-height:1.5}
.leg .lb b{font-weight:650}
.leg .lb em{font-style:normal;color:var(--dim);display:block;font-size:12.5px;margin-top:2px}
.leg.clash .lt{color:#ffb02e}
.clashtag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:rgba(255,176,46,.18);color:#ffb02e;padding:2px 5px;border-radius:4px;margin-right:5px;vertical-align:1px}

/* ---------- search ---------- */
.search{width:100%;padding:11px 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:15px;margin-bottom:12px}
.search::placeholder{color:var(--dim2)}
.search:focus{outline:none;border-color:var(--acc)}

/* ---------- info ---------- */
.info{border-radius:14px;background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:10px}
.info h3{font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.info dl{margin:0;font-size:13.5px}
.info dt{color:var(--dim2);font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-top:10px;font-weight:600}
.info dt:first-child{margin-top:0}
.info dd{margin:3px 0 0;color:var(--tx);line-height:1.5}
.linkrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--tx)}
.linkrow:first-of-type{border-top:none}
.linkrow .ic{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:15px;flex:none}
.linkrow .lt2{flex:1;min-width:0}
.linkrow .lt2 b{display:block;font-size:14px;font-weight:600}
.linkrow .lt2 span{font-size:11.5px;color:var(--dim2)}
.linkrow .ar{color:var(--dim2);font-size:15px}

.notes{width:100%;min-height:100px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:14px;resize:vertical}
.notes:focus{outline:none;border-color:var(--acc)}

.empty{text-align:center;padding:50px 24px;color:var(--dim2)}
.empty .big{font-size:38px;margin-bottom:12px}
.empty p{font-size:14px;line-height:1.6;margin:0}

.warn{font-size:11.5px;color:var(--dim2);text-align:center;padding:18px 24px 0;line-height:1.6}

/* ---------- bottom nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;background:rgba(12,11,15,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safeb)}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim2);font-size:10px;font-weight:600;letter-spacing:.02em}
nav button .ni{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}
nav button .cnt[hidden]{display:none}
nav button .cnt{position:absolute;transform:translate(14px,-4px);background:var(--acc);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">ATN</div>
    <div>
      <h1>All Together Now 2026</h1>
      <div class="sub">Curraghmore · 30 Jul – 2 Aug</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="refresh" title="Check for updates">&#8635;</button>
  </div>
  <div class="days" id="days"></div>
  <div class="filters" id="filters"></div>
</header>

<div id="nowbar" hidden></div>
<main id="main"></main>

<nav>
  <button data-v="picks" class="on"><span class="ni">&#9733;</span>Picks</button>
  <button data-v="sched"><span class="ni">&#9636;</span>Full</button>
  <button data-v="map"><span class="ni">&#9906;</span>Map</button>
  <button data-v="plan"><span class="ni">&#9873;</span>Plan<span class="cnt" id="cnt" hidden>0</span></button>
  <button data-v="info"><span class="ni">&#9432;</span>Info</button>
</nav>

<script src="data.js"></script>
<script src="guide.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
